# Chạy local cho cả team: Postgres + nạp dữ liệu mock + MCP server.
#   docker compose up --build
#   -> http://localhost:8080/health , MCP ở http://localhost:8080/mcp (header X-Api-Key: dev-key)
# Dữ liệu là MOCK. Chỉ dùng cho máy local, không dùng cấu hình này để deploy.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"            # cổng 55432 trên máy để tránh trùng Postgres sẵn có
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  db-init:                      # chạy 1 lần: tạo schema vb + nạp seed (xóa dữ liệu cũ trong schema vb)
    build: .
    command: ["python", "db/load_db.py"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  mcp:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      MCP_API_KEY: ${MCP_API_KEY:-dev-key}
      VB_CUSTOMER_ID: KH0001
      DEMO_NOW: ${DEMO_NOW:-2026-10-21T09:30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
