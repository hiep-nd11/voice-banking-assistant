services:
  backend:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./backend/app/config:/app/app/config:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
